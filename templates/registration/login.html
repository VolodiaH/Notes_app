{% extends 'notes/base.html' %}
{% block title %}Вхід — Нотатник{% endblock %}
{% block content %}
<div class="editor mx-auto">
    <h1 class="mb-4">Вхід до Нотатника</h1>
    <form method="post" class="card border-0 shadow-sm rounded-4 p-4">
        {% csrf_token %}
        {% if form.non_field_errors %}<div class="alert alert-danger" role="alert">Невірне ім’я користувача або пароль.</div>{% endif %}
        {% for field in form %}
        <div class="mb-3">
            <label class="form-label" for="{{ field.id_for_label }}">{% if field.name == 'username' %}Ім’я користувача{% else %}Пароль{% endif %}</label>
            {{ field }}
            {{ field.errors }}
        </div>
        {% endfor %}
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-success" type="submit">Увійти</button>
    </form>
</div>
{% endblock %}
